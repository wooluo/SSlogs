log_path: logs/*.log
server:
  ip: 192.168.1.100
log_format:
  type: web
  timestamp_format: '%d/%b/%Y:%H:%M:%S %z'
  fields:
    src_ip: (\d+\.\d+\.\d+\.\d+)
    timestamp: \[(.*?)\]
    request_line: '"([A-Z]+\s+[^\s]+\s+HTTP/[\d\.]+)"'
    request_method: '"([A-Z]+)\s'
    request_path: '"[A-Z]+\s+([^\s]+)\s+'
    http_version: '(HTTP/\d\.\d)"'
    status_code: '"\s+(\d{3})\s+'
    response_size: '\s+(\d+)\s+'
    processing_time: '\s+([\d.]+)\s+'
    user_agent: '"user_agent":"([^"]*)"'
    client_info: '{(.*?)}'
rule_dir: rules
rules:
  path: rules/
  default_severity: medium
  case_sensitive: false
  max_matches: 50
  auto_reload: true
analysis:
  batch_size: 1000
  max_events: 100
  memory_limit_mb: 500
  dynamic_batch_size: true
  memory_optimization: aggressive
  rule_preloading: true
context_lines: 5
ai_analysis:
  high_risk_only: true
  successful_attacks_only: true
  # 攻击成功的HTTP状态码定义：只保留2xx/3xx成功响应。
  # 注意：403/404/405/500表示请求被拒绝或失败，不应视为"攻击成功"。
  success_status_codes:
  - '200'
  - '201'
  - '202'
  - '204'
  - '301'
  - '302'
  - '304'
  max_ai_analysis: 5
  high_risk_severity: high
output_dir: output
report_type: html
report:
  template: templates/report_template.html
  output_format: html
  output_directory: reports
# ⚠️ 安全提示：生产环境中建议使用环境变量存储API密钥
# 示例：export SSLOGS_AI_API_KEY="your-actual-api-key"
deepseek:
  api_key: demo_key_for_testing  # 示例密钥，生产环境请使用环境变量
  model: deepseek-ai/DeepSeek-V3
  base_url: https://api.siliconflow.cn/v1/chat/completions
  timeout: 30
  max_tokens: 2048
ai:
  type: cloud
  local_provider: ollama
  cloud_provider: deepseek
  max_retries: 3
  retry_delay: 1
  retry_backoff: 2
  default_timeout: 30

# 白名单配置：上下文分析阶段会用这些列表做误报抑制。
# 缺省值见 core/rule_engine.py 的 _DEFAULT_* 常量；此处可按环境覆盖。
# 注意：纯按 User-Agent 过滤爬虫存在被伪造绕过的风险，建议仅作辅助。
whitelist:
  # 安全爬虫/合法机器人 User-Agent 关键字（命中即跳过该条告警）
  safe_agents:
    - googlebot
    - bingbot
    - slurp
    - duckduckbot
    - baiduspider
    - yandexbot
    - facebookexternalhit
    - twitterbot
    - linkedinbot
    - pinterest
    - applebot
    - semrushbot
    - mj12bot
    - ahrefsbot
    - dotbot
    - archive.org_bot
  # 静态资源扩展名（请求以这些结尾时通常非攻击目标）
  static_extensions:
    - .css
    - .js
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .svg
    - .ico
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .otf
    - .mp4
    - .mp3
    - .avi
    - .mov
    - .pdf
    - .xml
  # 健康检查/监控端点
  health_paths:
    - /health
    - /healthcheck
    - /ping
    - /status
    - /metrics
    - /actuator/health
    - /ready
    - /.well-known/
    - /robots.txt
    - /favicon.ico
  # 内部服务请求来源（命中后降低优先级但不完全过滤）
  internal_ips:
    - 127.0.0.1
    - ::1
    - localhost

# 增强的规则引擎配置
rule_engine:
  enable_context_analysis: true
  threat_scoring: true
  false_positive_filter: true
  adaptive_threshold: true
  rule_cache_size: 1000
  enable_precompilation: true

# 性能监控配置
performance:
  enable_monitoring: true
  track_memory: true
  track_time: true
  error_rate_threshold: 10
  memory_warning_threshold: 500
  performance_log_interval: 100
ollama:
  model: deepseek-r1:14b
  base_url: http://localhost:11434/api/chat
  timeout: 60
# 自定义 OpenAI 兼容端点：把 ai.cloud_provider 设为 custom 时启用。
# base_url 为 OpenAI 兼容 base（通常以 /v1 结尾）；api_key 建议留空走环境变量 SSLOGS_AI_API_KEY。
custom:
  base_url: https://api.openai.com/v1
  api_key: ''
  model: gpt-4o-mini
  timeout: 30
  max_tokens: 2048
# 智谱 GLM（OpenAI 兼容端点）：把 ai.cloud_provider 设为 zhipu 时启用。
# base_url 留空时按 coding_plan 自动派生：标准走 /api/paas/v4，编程套餐走 /api/coding/paas/v4。
# api_key 建议留空走环境变量 SSLOGS_AI_API_KEY。
zhipu:
  base_url: ''
  api_key: ''
  model: glm-4.6
  coding_plan: false
  timeout: 30
  max_tokens: 2048
geoip_db_path: config/GeoLite2-Country.mmdb

# 日志配置
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/sslogs.log
